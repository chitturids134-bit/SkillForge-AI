<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Circle Soft Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020" />
      <stop offset="100%" stop-color="#151A2E" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Primary Monogram Gradient -->
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Secondary Accent Layer -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Container with Thin Premium Border -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Seamless Geometric SF Monogram Icon -->
  <g filter="url(#subtleGlow)" transform="translate(256, 256) scale(0.9) translate(-256, -256)">
    <!-- Top Arc of 'S' flowing into 'F' stem -->
    <path 
      d="M 330 160 C 330 160, 240 160, 200 160 C 160 160, 140 185, 140 215 C 140 250, 175 270, 220 270 L 290 270 C 335 270, 370 295, 370 335 C 370 380, 335 400, 280 400 L 170 400" 
      stroke="url(#monogramGrad)" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Integrated Horizontal Crossbar of 'F' -->
    <path 
      d="M 220 270 L 340 270" 
      stroke="url(#accentGrad)" 
      stroke-width="32" 
      stroke-linecap="round" 
    />

    <!-- Vertical Core Spine of 'F' -->
    <path 
      d="M 200 160 L 200 370" 
      stroke="url(#monogramGrad)" 
      stroke-width="36" 
      stroke-linecap="round" 
    />

    <!-- Quantum AI Node Center Accent -->
    <circle cx="340" cy="160" r="14" fill="#00D4FF" />
  </g>
</svg>
